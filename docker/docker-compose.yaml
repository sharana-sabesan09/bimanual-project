services:
  bimanual:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bimanual-train
    container_name: bimanual-train
    # runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - type: bind
        source: ..
        target: /workspace
    working_dir: /workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
